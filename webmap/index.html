<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GeoTrafficView-3D — 위성맵 · ITS CCTV · 실추론</title>
    <style>
      html, body, #map { margin: 0; height: 100%; width: 100%; }
      #controls {
        position: absolute; top: 10px; right: 10px; z-index: 5;
        background: rgba(20,24,31,.85); color: #e6edf3; padding: 10px 12px; border-radius: 8px;
        font: 12px/1.5 -apple-system, "Segoe UI", sans-serif; backdrop-filter: blur(4px); min-width: 180px;
      }
      #controls h1 { font-size: 13px; margin: 0 0 6px; }
      #controls label { display: flex; gap: 7px; align-items: center; cursor: pointer; }
      #controls .hint { color: #9aa7b4; font-size: 11px; margin-top: 6px; }
      /* 좌측 탐지 패널 */
      #detect {
        position: absolute; top: 10px; left: 10px; z-index: 6; width: 460px; max-width: 46vw;
        background: rgba(12,14,18,.96); border: 1px solid #2b333d; border-radius: 8px; display: none;
        color: #e6edf3; font: 12px/1.4 "Segoe UI", sans-serif; overflow: hidden;
      }
      #detect .hd { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; }
      #detect .hd b { font-size: 13px; }
      #detClose { cursor: pointer; padding: 0 6px; }
      #stage { position: relative; width: 100%; background: #000; line-height: 0; }
      #vid, #cv { width: 100%; display: block; }
      #cv { position: absolute; top: 0; left: 0; }
      #detInfo { padding: 6px 10px; color: #9aa7b4; }
      .badge { display:inline-block; padding:1px 6px; border-radius:4px; background:#ec4899; color:#fff; font-size:10px; }
      /* LLM 채팅 */
      #chat { position:absolute; bottom:12px; left:12px; z-index:7; width:370px; max-width:44vw;
        background:rgba(12,14,18,.95); border:1px solid #2b333d; border-radius:10px; color:#e6edf3;
        font:12px/1.5 "Segoe UI",sans-serif; overflow:hidden; }
      #chatHd { padding:8px 12px; font-weight:600; cursor:pointer; display:flex; justify-content:space-between;
        align-items:center; background:#161b22; }
      #chatMsgs { max-height:300px; overflow-y:auto; padding:8px 10px; }
      .msg { margin:5px 0; padding:7px 10px; border-radius:8px; white-space:pre-wrap; }
      .msg.u { background:#1f6feb33; border:1px solid #1f6feb55; margin-left:28px; }
      .msg.a { background:#20242b; border:1px solid #2b333d; margin-right:12px; }
      .msg .sql { margin-top:6px; font:11px/1.4 ui-monospace,monospace; color:#7ee787; background:#0c0e12;
        padding:5px 7px; border-radius:5px; overflow-x:auto; }
      .msg table { border-collapse:collapse; margin-top:6px; font-size:11px; }
      .msg th,.msg td { border:1px solid #2b333d; padding:2px 7px; text-align:left; }
      .msg .err { color:#ff7b72; }
      #chatChips { padding:2px 10px 8px; display:flex; flex-wrap:wrap; gap:5px; }
      .chip { background:#20242b; border:1px solid #2b333d; border-radius:12px; padding:3px 9px; cursor:pointer; color:#9aa7b4; font-size:11px; }
      .chip:hover { color:#e6edf3; border-color:#3b82f6; }
      #chatIn { display:flex; gap:6px; padding:0 10px 10px; }
      #chatQ { flex:1; background:#0c0e12; color:#e6edf3; border:1px solid #2b333d; border-radius:6px; padding:6px 9px; }
      #chatSend { background:#22d3ee; color:#04121a; border:0; border-radius:6px; padding:0 12px; font-weight:700; cursor:pointer; }
      #chatSend:disabled { opacity:.5; cursor:wait; }
      #chat.min #chatBody { display:none; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="controls">
      <h1>GeoTrafficView-3D</h1>
      <div><b>Basemap</b></div>
      <label><input type="checkbox" id="bm-esri" checked /> Esri World Imagery</label>
      <label><input type="checkbox" id="bm-s2" /> Sentinel-2 cloudless</label>
      <div class="hint" id="camCount">CCTV 로드 중…</div>
      <div class="hint"><span style="color:#22d3ee">●</span> 실추론 CCTV · <span style="color:#3b82f6">●</span> 라이브만</div>
    </div>
    <div id="detect">
      <div class="hd"><b id="detTitle">CCTV</b><span><span class="badge">LIVE 탐지</span> <span id="detClose">✕</span></span></div>
      <div id="stage"><video id="vid" muted playsinline></video><canvas id="cv"></canvas></div>
      <div id="detInfo">YOLO11 + BoT-SORT 실추론 · 핑크 3D 박스 = 검출 객체. 지도(우측)에 실좌표 3D 박스 동기 표출.</div>
    </div>

    <div id="chat">
      <div id="chatHd">💬 교통 LLM 질의 <span style="color:#9aa7b4;font-weight:400;">(Qwen · PostGIS)</span><span id="chatMin">▾</span></div>
      <div id="chatBody">
        <div id="chatMsgs"></div>
        <div id="chatChips"></div>
        <div id="chatIn">
          <input id="chatQ" placeholder="예: 가장 혼잡한 카메라는?" autocomplete="off" />
          <button id="chatSend">▶</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
